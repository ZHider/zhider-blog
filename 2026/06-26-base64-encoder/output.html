<div class="form-group">
  <label for="base64Output">输出结果：</label>
  <div class="input-group mb-2">
    <textarea class="form-control" id="base64Output" rows="5" readonly placeholder="输出结果将显示在这里"></textarea>
    <div class="input-group-append">
      <button id="copyBtn" class="btn btn-outline-primary" data-clipboard-target="#base64Output">复制</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  if (typeof ClipboardJS !== "undefined") new ClipboardJS("#copyBtn");
});
</script>
