<div class="form-group">
  <label for="base64Input">输入内容：</label>
  <textarea class="form-control" id="base64Input" rows="5" placeholder="输入要编码的文本，或粘贴要解码的 Base64 字符串"></textarea>
</div>

<div class="mb-3">
  <button id="encodeBtn" class="btn btn-primary mr-2 mb-1">编码为 Base64</button>
  <button id="decodeBtn" class="btn btn-success mr-2 mb-1">解码为文本</button>
  <button id="swapBtn" class="btn btn-outline-secondary mr-2 mb-1">互换</button>
  <button id="clearBtn" class="btn btn-outline-danger mb-1">清空</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var input = document.getElementById("base64Input");
  var output = document.getElementById("base64Output");
  var status = document.getElementById("statusMsg");

  function msg(text, err) {
    status.textContent = text;
    status.className = "text-muted" + (err ? " text-danger" : "");
  }

  document.getElementById("encodeBtn").addEventListener("click", function () {
    if (!input.value) { msg("请输入要编码的内容", true); return; }
    try {
      output.value = b64Encode(input.value, document.getElementById("charsetSelect").value);
      msg("编码完成！");
    } catch (e) { msg(e.message, true); }
  });

  document.getElementById("decodeBtn").addEventListener("click", function () {
    if (!input.value) { msg("请输入要解码的 Base64 字符串", true); return; }
    try {
      output.value = b64Decode(input.value, document.getElementById("charsetSelect").value);
      msg("解码完成！");
    } catch (e) { msg(e.message, true); }
  });

  document.getElementById("swapBtn").addEventListener("click", function () {
    var t = input.value; input.value = output.value; output.value = t;
    msg("已互换");
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    input.value = ""; output.value = ""; msg("");
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      if (e.shiftKey) document.getElementById("decodeBtn").click();
      else document.getElementById("encodeBtn").click();
    }
  });
});
</script>
