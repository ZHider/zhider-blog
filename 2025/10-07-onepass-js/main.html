<link rel="stylesheet" href="ui-style.css" type="text/css" />
<script src="onepass.js"></script>
<script src="ui-hook.js"></script>

<div class="onepass-container container-fluid">
  <div class="form-group">
    <label for="param1">Master Password:</label>
    <input
      type="password"
      class="form-control"
      id="param1"
      placeholder="Enter your master password"
    />
  </div>

  <div class="form-group">
    <label for="param2">Site Name:</label>
    <input
      type="text"
      class="form-control"
      id="param2"
      placeholder="Enter site name (e.g., example.com)"
    />
  </div>

  <div class="form-group">
    <label for="passwordLength"
      >Password Length: <span id="lengthDisplay">16</span> characters</label
    >
    <input
      type="range"
      class="custom-range"
      id="passwordLength"
      min="8"
      max="64"
      value="16"
    />
  </div>

  <div>
    <input type="checkbox" id="specialChars" checked />
    <label for="specialChars">Include Special Characters</label>
  </div>

  <div>
    <input type="checkbox" id="capitalizeFirst" checked />
    <label for="capitalizeFirst">Capitalize First Letter</label>
  </div>

  <div>
    <input type="checkbox" id="savePassword" />
    <label for="savePassword">Save Master Password (locally)</label>
  </div>

  <div class="mb-1 mt-3">
    <button id="generateBtn" class="btn btn-primary btn-lg mr-2">
      Generate Password
    </button>
    <button id="copyBtn" class="btn btn-secondary btn-lg ml-2">
      Copy to Clipboard
    </button>
  </div>

  <div class="form-group mb-5">
    <label for="generatedPassword">Generated Password:</label>
    <textarea
      class="form-control"
      id="generatedPassword"
      rows="1"
      readonly
    ></textarea>
  </div>
</div>

<script>
  // 更新密码长度显示
  document
    .getElementById("passwordLength")
    .addEventListener("input", function () {
      document.getElementById("lengthDisplay").textContent = this.value;
    });
</script>
